name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:          # release.yml gates the image push on this

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
