# Publishes on a v* tag only — merging this file uploads nothing.
# Pushes the server image to GHCR as ghcr.io/<owner>/priompt.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  # A broken tag must not publish: run the full test suite first.
  test:
    uses: ./.github/workflows/test.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # push to GHCR
    steps:
      - uses: actions/checkout@v7
      # QEMU only runs the arm64 runtime stage (apk add); Go cross-compiles natively.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
